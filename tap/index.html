<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Durga Sai Sri Ramireddy</title>
<meta name="description" content="MS Cybersecurity, University of Houston. Interested in SOC, Detection Engineering. AI-assisted SOC">
<meta name="theme-color" content="#070718">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070718;
    --violet: #8B5CF6;
    --blue: #3B82F6;
    --pink: #C158F5;
    --lav: #C9C2FF;
    --text: #F4F2FF;
    --muted: #A9A4D6;
    --glass: rgba(24, 20, 70, .55);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(120% 60% at 85% 0%, rgba(139,92,246,.35), transparent 60%),
      radial-gradient(90% 50% at 0% 100%, rgba(59,130,246,.30), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    display: flex;
    justify-content: center;
    padding: max(env(safe-area-inset-top), 22px) 20px max(env(safe-area-inset-bottom), 22px);
    overflow-x: hidden;
    position: relative;
  }
  /* faint dot grid like the poster */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(201,194,255,.22) 1px, transparent 1.2px);
    background-size: 18px 18px;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 70%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 70%);
    pointer-events: none;
  }
  /* glowing wave */
  .wave {
    position: fixed; left: -10%; right: -10%; bottom: -6%;
    width: 120%; height: 38%;
    pointer-events: none; opacity: .9;
  }
  .wave path { animation: drift 14s ease-in-out infinite alternate; transform-origin: center; }
  @keyframes drift { to { transform: translateY(10px) scaleX(1.03); } }

  main {
    position: relative;
    width: 100%; max-width: 420px;
    display: flex; flex-direction: column; justify-content: center;
    gap: 26px;
  }
  header { display: flex; flex-direction: column; gap: 10px; }
  .badge {
    align-self: flex-start;
    font-size: .8rem; font-weight: 600;
    color: var(--lav);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid transparent;
    background:
      linear-gradient(var(--glass), var(--glass)) padding-box,
      linear-gradient(90deg, var(--pink), var(--blue)) border-box;
  }
  .photo {
    width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
    border: 3px solid transparent;
    background:
      linear-gradient(var(--bg), var(--bg)) padding-box,
      linear-gradient(135deg, var(--pink), var(--blue)) border-box;
    box-shadow: 0 0 28px rgba(139,92,246,.55);
  }
  h1 {
    font-weight: 800;
    font-size: clamp(2rem, 9.5vw, 2.6rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 4px 0 0;
    background: linear-gradient(180deg, #FFFFFF 0%, #C9C2FF 55%, #8FA8FF 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 0 18px rgba(139,92,246,.45));
  }
  .headline { margin: 0; color: var(--muted); font-size: .95rem; }

  nav { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 58px; padding: 0 20px;
    border-radius: 16px;
    border: 1.5px solid transparent;
    background:
      linear-gradient(var(--glass), var(--glass)) padding-box,
      linear-gradient(90deg, var(--pink), var(--blue)) border-box;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: var(--text);
    text-decoration: none; font-weight: 600; font-size: 1rem;
  }
  .btn .hint { font-weight: 400; font-size: .8rem; color: var(--muted); }
  .btn.primary {
    min-height: 68px; font-size: 1.1rem;
    background:
      linear-gradient(90deg, var(--violet), var(--blue)) padding-box,
      linear-gradient(90deg, var(--pink), var(--blue)) border-box;
    box-shadow: 0 0 30px rgba(99,102,241,.55);
  }
  .btn.primary .hint { color: #E6E3FF; }
  .btn:active { transform: scale(.985); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .wave path { animation: none; }
    .btn:active { transform: none; }
  }
</style>
</head>
<body>
<svg class="wave" viewBox="0 0 800 260" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#C158F5"/><stop offset=".5" stop-color="#6D5CF6"/><stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <path d="M0 150 C 150 60, 300 210, 460 140 S 700 70, 800 120" fill="none" stroke="url(#g1)" stroke-width="10" filter="url(#glow)" opacity=".8"/>
  <path d="M0 150 C 150 60, 300 210, 460 140 S 700 70, 800 120" fill="none" stroke="url(#g1)" stroke-width="3"/>
</svg>

<main>
  <header>
    <span class="badge">Attending OneCon26</span>
    <!-- Replace photo.jpg with your headshot (square crop works best), or delete this img line -->
    <img class="photo" src="photo.jpeg" alt="Portrait of Durga Sai Sri Ramireddy" width="84" height="84">
    <h1>Durga Sai Sri Ramireddy</h1>
    <p class="headline">MS Cybersecurity, University of Houston. Interested in SOC, Detection Engineering and AI-assisted SOC</p>
  </header>

  <nav aria-label="Links">
    <!-- 1. Replace with your custom LinkedIn URL -->
    <a class="btn primary" href="https://www.linkedin.com/in/durga-ramireddy/" rel="noopener">Connect on LinkedIn <span class="hint">Open profile</span></a>
    <!-- 2. Replace with your portfolio URL -->
    <a class="btn" href="https://durgaramireddy.github.io/" rel="noopener">Portfolio <span class="hint">Labs and projects</span></a>
    <!-- 3. Upload your resume as resume.pdf next to this file -->
    <a class="btn" href="resume.pdf">Resume <span class="hint">PDF</span></a>
    <!-- 4. Upload the .vcf file next to this file -->
    <a class="btn" href="durga-ramireddy.vcf">Save my contact <span class="hint">Add to phone</span></a>
  </nav>
</main>
</body>
</html>
